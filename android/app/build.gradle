import com.android.build.api.artifact.ScopedArtifact
import com.android.build.api.variant.ScopedArtifacts
import java.util.jar.JarOutputStream
import java.util.zip.ZipEntry
import java.util.zip.ZipFile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
file("${rootDir}/local.properties").withInputStream { localProperties.load(it) }
def appKey = localProperties.getProperty('appKey')
def appSecret = localProperties.getProperty('appSecret')
if (appKey == null || appKey.trim().isEmpty()) {
    throw new GradleException('Missing appKey in local.properties')
}
if (appSecret == null || appSecret.trim().isEmpty()) {
    throw new GradleException('Missing appSecret in local.properties')
}

configurations.all {
    exclude group: 'com.thingclips.smart', module: 'thingsmart-modularCampAnno'
}

android {
    namespace 'io.github.emi.tuyaonboarding'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.emi.tuyaonboarding'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildConfigField 'String', 'TUYA_APP_KEY', "\"${appKey}\""
        buildConfigField 'String', 'TUYA_APP_SECRET', "\"${appSecret}\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += '**/libthing_security.so'
        }
    }
}

// The app ships its own com.thingclips.smart.security.jni classes. Debug dexing keeps app and library
// dex files apart, so the app copy wins by load order; release merges everything, so the SDK copy must go.
abstract class DropSdkSecurityJniTask extends DefaultTask {
    static final Set<String> OVERRIDDEN = [
        'com/thingclips/smart/security/jni/JNICLibrary.class',
        'com/thingclips/smart/security/jni/SecureNativeApi.class'
    ] as Set

    @InputFiles
    abstract ListProperty<RegularFile> getAllJars()

    @InputFiles
    abstract ListProperty<Directory> getAllDirectories()

    @OutputFile
    abstract RegularFileProperty getOutput()

    @TaskAction
    void run() {
        def dropped = new HashSet<String>()
        new JarOutputStream(output.get().asFile.newOutputStream()).withCloseable { out ->
            allDirectories.get().each { directory ->
                def root = directory.asFile
                root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                    out.putNextEntry(new ZipEntry(root.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)))
                    file.withInputStream { out << it }
                    out.closeEntry()
                }
            }
            allJars.get().each { jar ->
                new ZipFile(jar.asFile).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.directory || entry.name.startsWith('META-INF/') || entry.name == 'module-info.class') return
                        if (OVERRIDDEN.contains(entry.name)) {
                            dropped.add(entry.name)
                            return
                        }
                        out.putNextEntry(new ZipEntry(entry.name))
                        zip.getInputStream(entry).withCloseable { out << it }
                        out.closeEntry()
                    }
                }
            }
        }
        if (dropped != OVERRIDDEN) {
            throw new GradleException("Expected the Tuya SDK to define ${OVERRIDDEN - dropped}")
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def task = project.tasks.register("${variant.name}DropSdkSecurityJni", DropSdkSecurityJniTask)
        variant.artifacts.forScope(ScopedArtifacts.Scope.ALL)
            .use(task)
            .toTransform(ScopedArtifact.CLASSES.INSTANCE, { it.allJars }, { it.allDirectories }, { it.output })
    }
}

tasks.matching { it.name == 'processDebugManifestForPackage' }.configureEach {
    doLast {
        def manifest = file("${buildDir}/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml")
        def original = manifest.text
        def updated = original.replace('android:debuggable="true"', 'android:debuggable="false"')
        if (original == updated) {
            throw new GradleException('Expected generated debug manifest to contain android:debuggable="true"')
        }
        manifest.text = updated
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.50'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'com.thingclips.smart:thingsmart:7.11.0'

    testImplementation 'junit:junit:4.13.2'
}
